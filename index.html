<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-dark bg-dark">
        <span class="navbar-brand mb-0 h1">📋 Gestor de Tareas</span>
        </nav>
    </header>
    <main class="container my-4">
        <div class="d-flex flex-wrap gap-3 mb-3">
        <span class="badge text-bg-warning-subtle text-warning-emphasis fs-6 px-3 py-2">
            <i class="bi bi-hourglass-split"></i> <span id="contPendientes">Pendientes: 0</span>
        </span>
         <span class="badge text-bg-info-subtle text-info-emphasis fs-6 px-3 py-2">
            <i class="bi bi-gear"></i> <span id="contEnProgreso">En Progreso: 0</span>
        </span>
        <span class="badge text-bg-success-subtle text-success-emphasis fs-6 px-3 py-2">
                <i class="bi bi-check2-circle"></i> <span id="contCompletadas">Completadas: 0</span>
        </span>
        </div>
        <button id="btnNuevaTarea" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#taskModal">
            <i class="bi bi-plus-lg"></i> Nueva Tarea
        </button>        
        <div class="card shadow-sm p-3 mb-4">
            <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" id="buscarInput" class="form-control" placeholder="Buscar por título...">
        </div>
             
        <div class="row g-2 mb-3">

    <!-- Filtro de Prioridad -->
            <div class="col-12 col-md-6">
                <label for="filtroPrioridad" class="form-label">Prioridad</label>
                    <select id="filtroPrioridad" class="form-select">
                        <option value="" selected>Todas las prioridades</option>
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                    </select>
            </div>

    <!-- Filtro de Categoría -->
    <div class="col-12 col-md-6">
        <label for="filtroCategoria" class="form-label">Categoría</label>
        <select id="filtroCategoria" class="form-select">
            <option value="" selected>Todas las categorías</option>
            <option value="personal">Personal</option>
            <option value="trabajo">Trabajo</option>
            <option value="estudio">Estudio</option>
            <option value="otro">Otro</option>
        </select>
    </div>
</div>
</div>
        

        <div class="kanban-board d-flex gap-3" id="kanbanBoard">
            <div class="kanban-col">
              <h6 class="kanban-col-title">Pendiente</h6>
              <div class="kanban-cards" data-status="pendiente"></div>
          </div>
          <div class="kanban-col">
              <h6 class="kanban-col-title">En Progreso</h6>
              <div class="kanban-cards" data-status="progreso"></div>
          </div>
          <div class="kanban-col">
              <h6 class="kanban-col-title">Completada</h6>
              <div class="kanban-cards" data-status="completada"></div>
          </div>

        </div>
        
        
        <div id="emptyMessage" class="text-center text-muted py-5 d-none">
            <i class="bi bi-clipboard-x" style="font-size: 3rem;"></i>
            <p class="mt-2 mb-0">No hay tareas que mostrar.</p>
        </div>

        <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="taskModalLabel">Nueva Tarea</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form id="taskForm">
        <div class="modal-body">
          <input type="hidden" id="taskId">

          <div class="mb-3">
            <label for="taskTitulo" class="form-label">Título <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="taskTitulo" required maxlength="80">
            <div class="form-text">Máximo 80 caracteres.</div>
          </div>

          <div class="mb-3">
            <label for="taskDescripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="taskDescripcion" rows="3"></textarea>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="taskPrioridad" class="form-label">Prioridad</label>
              <select id="taskPrioridad" class="form-select">
                <option value="baja">Baja</option>
                <option value="media" selected>Media</option>
                <option value="alta">Alta</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label for="taskCategoria" class="form-label">Categoría</label>
              <select id="taskCategoria" class="form-select">
                <option value="personal">Personal</option>
                <option value="trabajo">Trabajo</option>
                <option value="estudio">Estudio</option>
                <option value="otro">Otro</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label for="taskFecha" class="form-label">Fecha límite</label>
            <input type="date" class="form-control" id="taskFecha">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" id="saveTaskBtn" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteModalLabel">Confirmar eliminación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        ¿Seguro que deseas eliminar esta tarea? Esta acción no se puede deshacer.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Eliminar</button>
      </div>
    </div>
  </div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js" defer></script>
</body>
</html>
